<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xyock</title>

  <link rel="icon" href="/x/favicon/favicon.ico?v=1" sizes="any" />
  <link rel="icon" type="image/png" sizes="96x96" href="/x/favicon/favicon-96x96.png?v=1" />
  <link rel="apple-touch-icon" sizes="180x180" href="/x/favicon/apple-touch-icon.png?v=1" />
  <link rel="manifest" href="/x/favicon/site.webmanifest?v=1" />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- Pyodide: 브라우저에서 Python 코드 실행 -->
  <script defer src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --line: #2a2a2a;
      --text: #e0e0e0;
      --muted: #888;
      --accent: #7ae5b3;
      --error: #ff9a9a;
      --hdr: 86px;
      --pad: 50px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ===== 헤더 ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: var(--hdr);
      padding: 0 50px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5em;
      font-weight: 300;
      letter-spacing: 2px;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
    }
    .logo-mark {
      width: 56px;
      height: 56px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }
    .menu-wrap { position: relative; }
    .menu-btn {
      width: 44px;
      height: 44px;
      border: 2px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.3em;
      transition: all 0.2s ease;
    }
    .menu-btn:hover { border-color: #555; color: #ccc; }
    .menu-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 220px;
      background: var(--panel);
      border: 1px solid #333;
      border-radius: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      z-index: 200;
    }
    .menu-dropdown.show { display: block; }
    .menu-item {
      display: block;
      width: 100%;
      padding: 14px 18px;
      background: transparent;
      border: none;
      border-bottom: 1px solid #222;
      color: var(--text);
      text-align: left;
      font-size: 0.95em;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: rgba(255, 255, 255, 0.05); }
    .menu-item .sub { display: block; font-size: 0.8em; color: var(--muted); margin-top: 2px; }
    .menu-item.logged-in { color: var(--accent); }

    /* ===== 메인 ===== */
    main { flex: 1; }
    .view { display: none; }
    .view.show { display: block; }

    /* ===== 홈 섹션 ===== */
    .home-video {
      display: block;
      width: 100%;
      height: calc(100dvh - var(--hdr) - 40px);
      min-height: 260px;
      object-fit: contain;
      background: #000;
      padding: 20px 0;
    }
    .home-section {
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    .section-toggle {
      width: 100%;
      padding: 20px var(--pad);
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.1em;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .section-toggle:hover { background: rgba(255, 255, 255, 0.05); }
    .toggle-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      font-size: 0.8em;
      transition: transform 0.2s ease;
    }
    .section-toggle.active .toggle-icon { transform: rotate(90deg); }
    .section-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      padding: 0 var(--pad);
    }
    .section-content.show { max-height: 1000px; padding: 0 var(--pad) 20px var(--pad); }
    .section-content p { line-height: 1.6; color: var(--muted); margin: 0; }

    /* GitHub / Supabase 푸터 */
    .home-footer {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 28px;
      padding: 20px var(--pad);
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    .home-footer a {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-decoration: none;
    }
    .home-footer svg { width: 32px; height: 32px; display: block; flex: 0 0 32px; object-fit: contain; color: #fff; }
    .home-footer span { font-size: 0.95em; font-weight: 300; letter-spacing: 0.5px; color: var(--muted); }
    .home-footer a:hover span { color: #ccc; }
    .home-link { cursor: pointer; }

    /* Python 편집기 */
    .pad { padding: 40px 50px; }
    .editor-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .editor-head h2 { display: flex; align-items: center; gap: 10px; font-size: 1.3em; font-weight: 400; color: #fff; }
    .editor-head .logo-mark { width: 40px; height: 40px; }
    .editor-status { font-size: 0.85em; color: var(--muted); margin-top: 5px; }
    .btn-group { display: flex; gap: 8px; }
    .btn {
      padding: 9px 18px;
      border: 2px solid #333;
      background: transparent;
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95em;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .btn:hover { border-color: #555; background: rgba(255, 255, 255, 0.04); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn.primary { border-color: #2d6d4f; color: #a8d5ba; }
    .btn.primary:hover { background: rgba(45, 109, 79, 0.2); }
    .code-area {
      width: 100%;
      min-height: 320px;
      padding: 16px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e6e6e6;
      font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
      font-size: 0.95em;
      line-height: 1.6;
      resize: vertical;
      tab-size: 4;
      outline: none;
    }
    .code-area:focus { border-color: #555; }
    .output-label { margin: 18px 0 8px; font-size: 0.85em; color: var(--muted); }
    .output {
      min-height: 120px;
      padding: 16px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 8px;
      font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
      font-size: 0.92em;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: #c8c8d0;
    }
    .output.error { color: var(--error); }

    /* ===== 로그인 모달 ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: var(--panel);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }
    .modal-title { font-size: 1.6em; font-weight: 300; margin-bottom: 24px; text-align: center; color: #fff; letter-spacing: 1px; }
    .field {
      width: 100%;
      padding: 14px 18px;
      margin-bottom: 14px;
      font-size: 1em;
      background: transparent;
      border: 2px solid #333;
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      outline: none;
    }
    .field:focus { border-color: #555; }
    .field::placeholder { color: #666; }
    .modal-error { min-height: 1.2em; margin-bottom: 12px; color: var(--error); font-size: 0.9em; text-align: center; }
    .btn-block { width: 100%; padding: 12px; }
    .divider { display: flex; align-items: center; gap: 12px; color: #555; font-size: 0.85em; margin: 18px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #2a2a2a; }
    .btn-github {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: #f0f0f0;
      border: 2px solid #f0f0f0;
      color: #0a0a0a;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      font-size: 1em;
    }
    .btn-github:hover { background: #fff; border-color: #fff; }
    .modal-cancel { margin-top: 14px; width: 100%; }
    .toast {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f0f0f;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 0.95em;
      z-index: 3000;
      display: none;
      max-width: 90%;
      text-align: center;
    }
    .toast.show { display: block; }
    * { scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }

    /* ===== 반응형 ===== */
    @media (max-width: 768px) {
      :root { --hdr: 78px; --pad: 25px; }
      header { padding: 0 25px; }
      .pad { padding: 28px 25px; }
    }
    @media (max-width: 480px) {
      :root { --hdr: 70px; --pad: 15px; }
      header { padding: 0 15px; }
      .logo { font-size: 1.2em; }
      .logo-mark { width: 44px; height: 44px; }
      .pad { padding: 20px 15px; }
      .modal-content { padding: 28px 20px; }
      .home-footer { gap: 22px; }
      .home-footer svg { width: 28px; height: 28px; flex-basis: 28px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo home-link" href="#home" id="logoBtn"><img class="logo-mark" src="logo.png" alt="" />xyock</a>
    <div class="menu-wrap">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="메뉴" aria-expanded="false">☰</button>

  <!-- 로그인 모달 -->
  <div class="modal" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">

      <div class="modal-title" id="loginTitle">Login</div>

  <script>
    // ===== Supabase 설정 (xyock과 동일한 프로젝트) =====
    const SUPABASE_URL = "https://lhbdijxjnqbzmrvrvrkr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_e3oKyICzmGvyx1FFcO1dMQ_39veE0G4";
    const AUTH_URL = `${SUPABASE_URL}/auth/v1`;
    const FN_URL = `${SUPABASE_URL}/functions/v1`;
    const SESSION_KEY = "lockai_session"; // xyock 앱과 동일한 로그인 세션 키
    const LOGIN_POLL_MS = 3000;
    const LOGIN_TIMEOUT_MS = 5 * 60 * 1000;

    let session = loadSession();
    let pyPromise = null;
    let loginPending = false;

    // ===== 유틸 =====
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }
    function isLoggedIn() { return !!(session && session.access_token); }

    // ===== 세션 =====
    function loadSession() {
      try {
        const value = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
        return value && value.access_token && value.refresh_token && value.user_id ? value : null;
      } catch {
        return null;
      }
    }
    function saveSession(value) {
      session = value;
      localStorage.setItem(SESSION_KEY, JSON.stringify(value));
    }
    function clearSession() {
      session = null;
      localStorage.removeItem(SESSION_KEY);
    }
    function toSession(data, fallbackEmail) {
      return {
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Math.floor(Date.now() / 1000) + (Number(data.expires_in) || 3600),
        email: (data.user?.email || fallbackEmail || "").toLowerCase(),
        user_id: data.user?.id || ""
      };
    }

    async function ensureSession() {
      if (!session) return false;
      if (session.expires_at && session.expires_at - 60 > Math.floor(Date.now() / 1000)) return true;
      try {
        const response = await fetch(`${AUTH_URL}/token?grant_type=refresh_token`, {
          method: "POST",
          headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: session.refresh_token })
        });
        if (!response.ok) throw new Error("session refresh failed");
        const data = await response.json();
        saveSession(toSession(data, session.email));
        return true;
      } catch {
        clearSession();
        updateMenu();
        return false;
      }
    }

    // ===== 이메일 로그인 (xyock과 같은 승인 흐름) =====
    async function loginWithEmail(email, password) {
      const headers = { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" };
      const response = await fetch(`${FN_URL}/request-login`, {
        method: "POST",
        headers,
        body: JSON.stringify({ email, password })
      });
      if (response.status === 401) throw new Error("invalid");
      if (!response.ok) throw new Error(`request-login HTTP ${response.status}`);
      const { request_id, poll_token } = await response.json();
      if (!request_id || !poll_token) throw new Error("login request response invalid");

      const deadline = Date.now() + LOGIN_TIMEOUT_MS;
      while (Date.now() < deadline) {
        await new Promise((resolve) => setTimeout(resolve, LOGIN_POLL_MS));
        const pollResponse = await fetch(`${FN_URL}/check-login`, {
          method: "POST",
          headers,
          body: JSON.stringify({ request_id, poll_token })
        });
        if (!pollResponse.ok) throw new Error(`check-login HTTP ${pollResponse.status}`);
        const data = await pollResponse.json().catch(() => ({}));
        if (data.status === "approved") {
          if (!data.access_token || !data.refresh_token || !data.user?.id) throw new Error("approved response invalid");
          saveSession(toSession({
            access_token: data.access_token,
            refresh_token: data.refresh_token,
            expires_in: data.expires_in,
            user: data.user
          }, email));
          return;
        }
        if (data.status === "rejected") throw new Error("rejected");
        if (data.status === "expired") throw new Error("expired");
      }
      throw new Error("timeout");
    }

    // ===== GitHub 로그인 (Supabase OAuth) =====
    // Supabase Dashboard의 Redirect URLs에도 이 주소를 등록해야 합니다.
    const REDIRECT_URL = "https://xyock.github.io/x/homepage.html";
    function loginWithGithub() {
      const url = `${AUTH_URL}/authorize?provider=github&redirect_to=${encodeURIComponent(REDIRECT_URL)}`;
      location.href = url;
    }

    async function handleOAuthReturn() {
      if (!location.hash.includes("access_token=")) return;
      const params = new URLSearchParams(location.hash.slice(1));
      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");
      const expiresIn = params.get("expires_in");
      history.replaceState(null, "", location.pathname + location.search);
      if (!accessToken || !refreshToken) return;

      try {
        const response = await fetch(`${AUTH_URL}/user`, {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${accessToken}` }
        });
        if (!response.ok) throw new Error("Could not fetch user");
        const user = await response.json();
        if (!user?.id) throw new Error("User ID missing");
        saveSession(toSession({
          access_token: accessToken,
          refresh_token: refreshToken,
          expires_in: expiresIn,
          user
        }, user.email));
        updateMenu();
        showToast(`${session.email || "사용자"}님, GitHub로 로그인되었습니다.`);
      } catch {
        showToast("GitHub 로그인에 실패했습니다. 다시 시도해 주세요.");
      }
    }

    async function logout() {
      if (session) {
        try {
          await fetch(`${AUTH_URL}/logout`, {
            method: "POST",
            headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${session.access_token}` }
          });
        } catch { /* 로컬 세션은 아래에서 삭제합니다. */ }
      }
      clearSession();
      updateMenu();
      showToast("로그아웃했습니다.");
    }

    // ===== 메뉴 =====
    function updateMenu() {
      const loginBtn = document.getElementById("menuLogin");
      const sub = document.getElementById("menuLoginSub");
      if (isLoggedIn()) {
        loginBtn.classList.add("logged-in");
        loginBtn.firstChild.textContent = "로그아웃";
        sub.textContent = session.email || "로그인됨";
      } else {
        loginBtn.classList.remove("logged-in");
        loginBtn.firstChild.textContent = "로그인";
        sub.textContent = "이메일 또는 GitHub";
      }
    }
    function toggleMenu(force) {
      const dropdown = document.getElementById("menuDropdown");
      const willShow = force ?? !dropdown.classList.contains("show");
      dropdown.classList.toggle("show", willShow);
      document.getElementById("menuBtn").setAttribute("aria-expanded", String(willShow));
    }
    function onMenuLoginClick() {
      toggleMenu(false);
      if (isLoggedIn()) {
        if (confirm(`${session.email || "현재"} 계정에서 로그아웃할까요?`)) logout();
        return;
      }
      openLoginModal();
    }
    function openLoginModal() {
      document.getElementById("loginEmail").value = "";
      document.getElementById("loginPassword").value = "";
      document.getElementById("loginError").textContent = "";
      document.getElementById("loginModal").classList.add("show");
      setTimeout(() => document.getElementById("loginEmail").focus(), 100);
    }
    function closeLoginModal() {
      document.getElementById("loginModal").classList.remove("show");
      document.getElementById("loginPassword").value = "";
    }
    async function submitLogin() {
      if (loginPending) return;
      const email = document.getElementById("loginEmail").value.trim().slice(0, 200);
      const password = document.getElementById("loginPassword").value;
      const errorElement = document.getElementById("loginError");
      if (!email || !password) {
        errorElement.textContent = "이메일과 비밀번호를 입력해 주세요.";
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errorElement.textContent = "올바른 이메일 주소를 입력해 주세요.";
        return;
      }

      loginPending = true;
      document.getElementById("loginSubmit").disabled = true;
      document.getElementById("githubLogin").disabled = true;
      errorElement.textContent = "메일에서 승인을 기다리는 중...";
      try {
        await loginWithEmail(email, password);
      } catch (error) {
        const messages = {
          invalid: "이메일 또는 비밀번호가 올바르지 않습니다.",
          rejected: "로그인이 거절되었습니다.",
          expired: "승인 시간이 지났습니다. 다시 시도해 주세요.",
          timeout: "승인 시간이 지났습니다. 다시 시도해 주세요."
        };
        errorElement.textContent = messages[error.message] || "로그인 서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
        document.getElementById("loginPassword").value = "";
        loginPending = false;
        document.getElementById("loginSubmit").disabled = false;
        document.getElementById("githubLogin").disabled = false;
        return;
      }
      loginPending = false;
      document.getElementById("loginSubmit").disabled = false;
      document.getElementById("githubLogin").disabled = false;
      closeLoginModal();
      updateMenu();
      showToast(`${session.email || "사용자"}님, 로그인되었습니다.`);
    }

    // ===== 화면 전환 =====
    function showView(name) {
      const showPython = name === "python";
      document.getElementById("viewHome").classList.toggle("show", !showPython);
      document.getElementById("viewPython").classList.toggle("show", showPython);
      toggleMenu(false);
      if (showPython) {
        loadPython().catch(() => {});
        document.getElementById("codeArea").focus();
        history.replaceState(null, "", `${location.pathname}${location.search}#python`);
      } else {
        history.replaceState(null, "", `${location.pathname}${location.search}`);
      }
      window.scrollTo(0, 0);
    }

    // ===== Python 실행 =====
    function loadPython() {
      if (pyPromise) return pyPromise;
      const status = document.getElementById("pyStatus");
      const runButton = document.getElementById("runBtn");
      status.textContent = "Python 엔진 준비 중... (처음에는 시간이 조금 걸립니다)";
      pyPromise = Promise.resolve().then(() => {
        if (typeof window.loadPyodide !== "function") throw new Error("Pyodide script did not load");
        return window.loadPyodide();
      }).then((py) => {
        status.textContent = "Python 준비 완료";
        runButton.disabled = false;
        return py;
      }).catch((error) => {
        status.textContent = "Python 엔진을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.";
        pyPromise = null;
        throw error;
      });
      return pyPromise;
    }
    async function runPython() {
      const code = document.getElementById("codeArea").value;
      const output = document.getElementById("output");
      const runButton = document.getElementById("runBtn");
      output.textContent = "";
      output.classList.remove("error");
      if (!code.trim()) {
        output.textContent = "코드를 입력해 주세요.";
        return;
      }
      runButton.disabled = true;
      try {
        const py = await loadPython();
        py.setStdout({ batched: (value) => { output.textContent += value + "\n"; } });
        py.setStderr({ batched: (value) => { output.textContent += value + "\n"; } });
        await py.runPythonAsync(code);
        if (!output.textContent) output.textContent = "(출력 없음)";
      } catch (error) {
        output.classList.add("error");
        const message = error?.message || String(error);
        output.textContent += message;
      } finally {
        runButton.disabled = false;
      }
    }
    function onCodeKeydown(event) {
      if (event.key !== "Tab") return;
      event.preventDefault();
      const textarea = event.target;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      textarea.value = textarea.value.slice(0, start) + "    " + textarea.value.slice(end);
      textarea.selectionStart = textarea.selectionEnd = start + 4;
    }

    // ===== 이벤트 =====
    function setupEvents() {
      const menuButton = document.getElementById("menuBtn");
      menuButton.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleMenu();
      });
      document.addEventListener("click", (event) => {
        if (!document.querySelector(".menu-wrap").contains(event.target)) toggleMenu(false);
      });
      document.getElementById("menuPython").addEventListener("click", () => showView("python"));
      document.getElementById("menuLogin").addEventListener("click", onMenuLoginClick);

      // 로고를 누르면 홈으로 돌아갑니다.
      document.querySelectorAll(".home-link").forEach((element) => {
        element.addEventListener("click", (event) => {
          event.preventDefault();
          showView("home");
        });
      });

      // Description / Notice 접기·펼치기
      document.querySelectorAll(".section-toggle").forEach((button) => {
        button.addEventListener("click", () => {
          const content = document.getElementById(button.getAttribute("data-target"));
          const expanded = button.classList.toggle("active");
          content.classList.toggle("show", expanded);
          button.setAttribute("aria-expanded", String(expanded));
        });
      });

      document.getElementById("runBtn").addEventListener("click", runPython);
      document.getElementById("clearBtn").addEventListener("click", () => {
        const output = document.getElementById("output");
        output.textContent = "";
        output.classList.remove("error");
      });
      document.getElementById("codeArea").addEventListener("keydown", (event) => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          runPython();
          return;
        }
        onCodeKeydown(event);
      });
      document.getElementById("loginSubmit").addEventListener("click", submitLogin);
      document.getElementById("loginPassword").addEventListener("keydown", (event) => {
        if (event.key === "Enter") submitLogin();
      });
      document.getElementById("githubLogin").addEventListener("click", loginWithGithub);
      document.getElementById("loginCancel").addEventListener("click", closeLoginModal);
      document.getElementById("loginModal").addEventListener("click", (event) => {
        if (event.target.id === "loginModal") closeLoginModal();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          toggleMenu(false);
          closeLoginModal();
        }
      });
    }

    async function init() {
      setupEvents();
      updateMenu();
      await handleOAuthReturn();
      if (isLoggedIn()) {
        await ensureSession();
        updateMenu();
      }
      if (location.hash === "#python") showView("python");
    }
    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
